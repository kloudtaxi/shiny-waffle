id: S06
slug: conflicting-exceptions
title: Conflicting exception information
kind: fact_selection
question: What is Acme Manufacturing's maximum contractual NS-500 discount on a given date?
teaches: [temporal-facts, supersession-without-overwrite]
corpus: base
subject: { customer: CUST-1001, product: PROD-001 }
probes:
  - { as_of: 2026-09-23, expected_exception: EXC-ACME-NS500-15, expected_maximum: 0.15 }
  - { as_of: 2024-10-01, expected_exception: EXC-ACME-NS500-10, expected_maximum: 0.10 }
  - { as_of: 2022-10-01, expected_exception: null, expected_maximum: null }
expected:
  preserved: [EXC-ACME-NS500-10, EXC-ACME-NS500-15]
reasoning:
  - The current 15% exception supersedes the older one for dates within its validity period.
  - The older 10% exception remains historically valid for its own period — both facts are preserved.
