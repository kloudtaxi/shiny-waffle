[project]
name = "northstar-owm-lab"
version = "0.1.0"
description = "Northstar Industrial Systems — a seeded synthetic enterprise laboratory for the Sovera OWM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sovera AI" }]
dependencies = [
    "faker>=30",
    "polyfactory>=2.18",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
northstar = "northstar.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]
# The BlueLeaf lab MCP server (lab/blueleaf_mcp). Never a default group: the default install
# stays as it is (docs/superpowers/plans/2026-10-06-blueleaf-mcp-plan.md, §0).
mcp = ["mcp==2.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northstar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.isort]
known-first-party = ["northstar"]

# Runs are results and are never rewritten (CLAUDE.md), so a run script committed with a lint
# finding is excused here, file by file, rather than edited.
[tool.ruff.lint.per-file-ignores]
"runs/2026-10-09-semantica-bitemporal/check.py" = ["E501"]  # two hand-aligned lines over 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "lab/blueleaf_mcp"]
mypy_path = ["src", "lab/blueleaf_mcp"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faker.*", "polyfactory.*"]
ignore_missing_imports = true

# The lab modules, reached only through lab/blueleaf_mcp/service/_lab.py, which types what it
# re-exports (the BlueLeaf MCP spec, §11 B9).
[[tool.mypy.overrides]]
module = ["kernel", "flow", "engine", "credit", "serve", "build_register", "governed", "overlay"]
follow_imports = "skip"
ignore_missing_imports = true

# So a plain `uv run mypy` passes without the mcp group installed.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lab/blueleaf_mcp"]
addopts = "-ra"
markers = ["slow: replays a whole attack set (minutes)"]
