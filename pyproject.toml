[project]
name = "northstar-owm-lab"
version = "0.1.0"
description = "Northstar Industrial Systems — a seeded synthetic enterprise laboratory for the Sovera OWM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sovera AI" }]
dependencies = [
    "faker>=30",
    "polyfactory>=2.18",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
northstar = "northstar.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]
owm-service = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]
tui = [
    "textual>=8.2,<9",
    "textual-serve>=1.1,<2",
]

[tool.uv]
# The gate tests the pre-flight app (lab/preflight/tui/, G-50) and type-checks lab/owm_service,
# so a plain `uv sync` installs both groups (T12-c).
default-groups = ["dev", "tui", "owm-service"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northstar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "lab"]
# Runs are recorded results, kept as they ran: lint guards src, tests and lab (the user, 2026-10-18).
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# The contract names these errors without an Error suffix (Refused, NotFound, ...).
"lab/owm_service/errors.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["northstar", "owm_service", "rounds"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "lab/owm_service", "lab/rounds", "lab/contract_reader", "lab/exam", "lab/preflight", "lab/prototype_bundle"]
mypy_path = ["src", "lab"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faker.*", "polyfactory.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "kernel",
    "flow",
    "governed",
    "additions",
    "registrar",
    "build_procedures",
    "serve",
    "engine",
    "utopia",
    "blind_reader",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lab"]
addopts = "-ra"
# Starlette 1.7's test client warns that it will move from httpx to httpx2 (a UserWarning
# subclass); only that message is silenced, by its exact start.
filterwarnings = [
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated:UserWarning',
]
