[project]
name = "northstar-owm-lab"
version = "0.1.0"
description = "Northstar Industrial Systems — a seeded synthetic enterprise laboratory for the Sovera OWM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sovera AI" }]
dependencies = [
    "faker>=30",
    "polyfactory>=2.18",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
northstar = "northstar.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northstar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.isort]
known-first-party = ["northstar"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faker.*", "polyfactory.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
