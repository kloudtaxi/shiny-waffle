       * lab's review and re-review (shiny-waffle docs/contract-v1.2-review-2026-10-09.md,
       * c196b31 and 74aef92).
    replace: |2-
       * The v1.4 contract on `owm-decisions`: the shapes the OWM service serves for
       * the register, decisions, approvals and clearance. Section numbers below point
       * into an earlier contract document that this bundle doesn't carry; the
       * prototype spec (§3.2) and its Appendix A say what v2 keeps and changes.
    kind: doc
    why: the header named an earlier contract document and a lab review as the reference; neither is in the bundle

