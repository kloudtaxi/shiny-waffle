      out; a port replaces this module with its own ports.
    kind: comment
  - file: source/lab/owm_service/_lab.py
    match: "every recording under `runs/`, by request hash."
    replace: "recorded answers by request hash, from its own file."
    kind: comment
  - file: source/lab/owm_service/_lab.py
    match: |
      def replay_files(lab_root: Path) -> list[Path]:
          """Every recorded Jev exchange under `<lab_root>/runs`, as the admission gate reads them."""
          runs = lab_root / "runs"
          return sorted({*runs.rglob("*engine-calls*.jsonl"), *runs.rglob("*jev-calls*.jsonl")})
    replace: |
      def replay_files(lab_root: Path) -> list[Path]:
          """Recorded Jev exchanges to replay besides the engine's own file. The lab replayed its run
          records here; a port replays only its own recordings, so there are none."""
          return []
    kind: code
    why: the Jev replay over the lab's run records is removed; the engine replays only its own recordings

  # -- the lab's MCP tool server ------------------------------------------------------------------
  - file: source/lab/rounds/tools_server.py
    match: "DEAL_DESK_SCENARIO (`S22`)"
    replace: "DEAL_DESK_CASE_FILE"
    kind: comment
  - file: source/lab/rounds/tools_server.py
    match: |
      from rounds.scenarios import (  # noqa: E402
          APPLY_DISCOUNT_DESCRIPTION,
          DECIDE_DESCRIPTION,
          GET_REQUEST_DESCRIPTION,
          SCENARIOS,
          Scenario,
      )
    replace: |+
      # The tool descriptions are neutral, and the one request this server acts on comes from a case
      # file the caller supplies (DEAL_DESK_CASE_FILE), never from lab constants.
      GET_REQUEST_DESCRIPTION = "Read one discount request from the system of record."
      APPLY_DISCOUNT_DESCRIPTION = "Apply a discount to one discount request."
      DECIDE_DESCRIPTION = "Ask the OWM to decide one discount request."


      @dataclass(frozen=True)
      class Case:
          """The one request this server acts on: its id, the requester's email, and the body of
          POST /decisions, from a JSON file."""

          request_id: str
          requester_email: str
          decide_body: dict[str, Any]

          @classmethod
          def load(cls, path: str) -> Case:
              raw = json.loads(Path(path).read_text())
              return cls(str(raw["request_id"]), str(raw["requester_email"]), dict(raw["decide_body"]))

    kind: code
    why: >-
      the lab's per-case constants and tool prompts (imported from a module not in this bundle)
      are removed; the one request comes from a case file the caller supplies, and the tool
      descriptions are neutral
  - file: source/lab/rounds/tools_server.py
    match: '_REQUEST_ID = {"type": "string", "description": "For example DR-9001."}'
    replace: '_REQUEST_ID = {"type": "string", "description": "The request''s id in the system of record."}'
    kind: code
    why: a request id fixed in the tool schema's example is removed
  - file: source/lab/rounds/tools_server.py
