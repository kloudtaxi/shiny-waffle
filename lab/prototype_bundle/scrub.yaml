      DECIDE_DESCRIPTION = "Ask the OWM to decide one discount request."


      @dataclass(frozen=True)
      class Case:
          """The one request this server acts on: its id, the requester's email, and the body of
          POST /decisions, from a JSON file."""

          request_id: str
          requester_email: str
