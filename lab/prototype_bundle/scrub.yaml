      Refactored for experiment 5 (`runs/2026-10-03-exp5-credit/plan.md`) out of experiment 4's guarded
      discount engine (`runs/2026-10-03-adversarial/hybrid_v3.py`). The code moved verbatim; what the
    replace: "Refactored out of an earlier guarded discount engine. The code moved verbatim; what the"
    kind: comment
  - file: source/lab/owm_kernel/kernel.py
    match: |-
      (RR-12,
              `runs/2026-10-08-register-attacks/freeze.md`).
    replace: |-
      (the
              registrar's RR-12).
    kind: comment
  - file: source/lab/owm_kernel/kernel.py
    match: "revocation, `runs/2026-10-08-register-attacks/plan.md`, RR-12)."
    replace: "revocation, RR-12)."
    kind: comment
  - file: source/lab/owm_kernel/specs/credit_v3.yaml
    match: " (2026-10-05, runs/2026-10-05-register/plan.md)."
    replace: " (2026-10-05)."
    kind: comment
  - file: source/lab/owm_kernel/SPEC_FORMAT.md
    match: |-
      **Admission.** A spec is used only after it passes the admission gate
      (`lab/spec_admission/admit.py`, G-07), in its deployed form, with the company's register:
      - **A:** every clean scenario of its type is right;
      - **B:** no unsafe decision, and no error, on any sealed attack set of its type;
    replace: |-
      **Admission.** A spec is used only after it passes an admission check in its deployed form, with
      the company's register:
      - **A:** it decides its type's known cases correctly;
      - **B:** no unsafe decision, and no error, on its type's attack cases;
    kind: comment
  - file: source/lab/owm_kernel/SPEC_FORMAT.md
    match: "Always available: `sid`, the scenario id."
    replace: "Always available: `sid`, the id the caller gives the decision."
    kind: comment

