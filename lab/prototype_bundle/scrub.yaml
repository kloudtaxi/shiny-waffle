# The scrub (lab plan L1.2; LW-4): the reviewed rewrites applied to the bundle's source.
#
# `replace`: {file, match, replace, kind, why, count}. `file` is the path inside the bundle; `match`
# is a literal that must occur exactly `count` times (default 1), so drift refuses the export. A
# comment is rewritten as the mechanism it protects. A code change, or a rewrite in a copied
# document (`doc`), is listed in the export's README under "changed from source", with its `why`.
#
# `keep`: {file, match, why}. Reviewed mechanism words that the pattern
# `\bS[0-9]{1,2}\b|[Ss]cenario|[Tt]rap|[Tt]ruth|answer.key|MANIFEST` matches but that carry no
# lab knowledge. `file` is an fnmatch pattern.

