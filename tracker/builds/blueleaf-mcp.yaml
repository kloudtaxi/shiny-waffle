# The build tracker for the BlueLeaf lab MCP server: the source of the Lab Ledger's `build`
# collection. Seeded once by tracker/seed_build.py; after that the Ledger is the source of truth
# (statuses, choices, evidence and updates are made on the page or by Claude with pinned
# ArtifactData updates). Plan: docs/superpowers/plans/2026-10-06-blueleaf-mcp-plan.md.
build: blueleaf-mcp
plan: docs/superpowers/plans/2026-10-06-blueleaf-mcp-plan.md
spec: docs/superpowers/specs/2026-10-06-blueleaf-mcp-design.md
branch: skunkworks/blueleaf-mcp

phases:
  A: Walls first
  B: Sandboxes
  C: Engines
  D: Scoring the readers
  E: The experimenter server
  F: The subject server
  G: Records and setup
  H: Acceptance

decisions:
  - id: D-1
    title: How attack sets are applied
    plan_ref: plan §2 item 1
    blocks: [B-04]
    question: Should each attack set be applied by its own rule, as the runs that produced its committed results did?
    options:
      - key: A
        label: Each set by its own rule
        text: "Set A from its top-level files with pinned seal digests; set C with its `C1_` prefixes stripped; B, D, E and F as sealed. Every committed result reproduces, and `lab/spec_admission/admit.py` already applies the sets this way."
      - key: B
        label: One rule for every set (the spec as written)
        text: "Set F's rule for all six. Simpler, but set C fails to apply (its replacements find nothing to replace) and set A has no seal to check."
    recommended: A
    recommendation: "A. It is the only option under which sets A–E reproduce, and it matches the admission gate."
  - id: D-2
    title: What a whole-set sandbox runs
    plan_ref: plan §2 item 2
    blocks: [B-05, B-06, B-11]
    question: When a sandbox is seeded with a whole attack set, does it run each attack on its own, or all of them at once?
    options:
      - key: A
        label: One attack at a time
        text: "Each run applies one attack to the sandbox's documents and reports its target and side effects, as every committed set result does. T5 can pin it. A subject question on a set sandbox names its attack (`F6:S34`)."
      - key: B
        label: All attacks at once
        text: "One combined corpus. A different experiment: no committed result to check it against, and two attacks that replace the same file would collide."
      - key: C
        label: Both
        text: "Attack by attack by default, plus a combined option. More to build and test now."
    recommended: A
    recommendation: "A. Add a combined option later if an experiment needs it."
  - id: D-3
    title: What a blind subject may read
    plan_ref: plan §2 item 3
    blocks: [B-03, B-20]
    question: Which files may a subject read for a question?
    options:
      - key: A
        label: Only the readers' evidence
        text: "`documents/*.md` and `structured/*.csv`, exactly what every reader arm saw. Anything else is refused."
      - key: B
        label: Anything in the corpus folder (the spec as written)
        text: "Includes `MANIFEST.yaml`, which names the traps (\"similarly named but different customer\", \"Hearsay … deliberately remains\")."
    recommended: A
    recommendation: "A. B would let a blind subject read the trap list."
  - id: D-4
    title: How a registration is checked
    plan_ref: plan §2 item 4
    blocks: [B-07]
    question: When you register a document with structured terms in a sandbox, how are the terms checked against its text?
    options:
      - key: A
        label: Checks derived from the terms you give
        text: "The same needles the registrar checks (amounts, thresholds, periods, parties), computed from your terms. A test pins it: every committed entry passes, and changing any term fails."
      - key: B
        label: No text check
        text: "Terms are stored as given. Faster to build, but a typo in a term silently changes every decision that reads it."
    recommended: A
    recommendation: "A. The registrar's own checks can't be reused: `build_register.py` loads the truth, which the blind side must never import."
  - id: D-5
    title: Which engine decides for the subject, and what the mismatch mode changes
    plan_ref: plan §2 item 5
    blocks: [B-10, B-20]
    question: What should the subject's `decide` tool run, and what should a sandbox's mismatch mode switch?
    options:
      - key: A
        label: The governed procedure; named engines keep their meaning
        text: "`decide` runs the procedure in force on the question's date from the procedure register (G-13: discount v1 = discount+Ru, credit v1 = v3u, SLA v1 = sla+Ru). Every named engine keeps its committed declaration, so T5 pins it. The mismatch mode applies to sandbox procedures that don't declare one."
      - key: B
        label: The spec as written
        text: "The mode rewrites the register-backed engines' declarations. `discount+R` would then mean `discount+Ru` under the default, and committed results stop pinning the names."
    recommended: A
    recommendation: "A. It uses what main built in G-13 and keeps every engine name comparable with the committed runs."
  - id: D-6
    title: Live Jev in subject sessions
    plan_ref: plan §2 item 6
    blocks: [B-19, B-20]
    question: How does a subject session decide whether `decide` may make new (paid) Jev calls?
    options:
      - key: A
        label: An option when you open the session
        text: "`open_subject_session(…, live_jev=false)`. Off by default, capped at 200 new calls per server."
      - key: B
        label: A sandbox setting
        text: "A new `set_live_jev` tool. One more tool for T8 to pin."
      - key: C
        label: Never live for subjects
        text: "Replay only. A question that needs a new judgment gets `needs_live_jev` from `decide`."
    recommended: A
    recommendation: "A."
  - id: D-7
    title: Procedures in a sandbox, after G-13 and G-07
    plan_ref: plan §0.1
    blocks: [B-05, B-08, B-17]
    question: How much of the procedure register and the admission gate should a sandbox carry in v1?
    options:
      - key: A
        label: Copy the register; report admission; no new tool
        text: "Each sandbox copies the procedure register and its store. `write_procedure` validates; `check_procedure` reports the admission gate (A clean, B attacks, C reliance) from `admit.py`. Registering a new procedure version in a sandbox waits for v2."
      - key: B
        label: Full registration in the sandbox
        text: "Add a `register_procedure` tool: admission-gated, with the two-person rule. A new tool, more tests, a bigger build."
      - key: C
        label: Leave G-13 out
        text: "Sandboxes and `decide` use the spec files directly, as the spec was written before G-13."
    recommended: A
    recommendation: "A. It keeps v1's tool list and still shows whether a sandbox procedure would be admitted."
  - id: D-8
    title: Subject questions and grading, after G-35 and G-36
    plan_ref: plan §0.1
    blocks: [B-13, B-19, B-24]
    question: Should subject sessions use the lab's current reader setup or reproduce set F's?
    options:
      - key: A
        label: The current setup
        text: "Questions \"as recorded in\" the CRM or ERP see their own request in the export (G-36's overlay); `get_procedure` serves the adopted procedures with the conditions field (G-35); answers are graded for safety and their blocking conditions are counted. The acceptance walk-through compares with the re-baseline (`runs/2026-10-06-baseline`)."
      - key: B
        label: Set F's setup
        text: "The procedures as they were before G-35, and no overlay. Directly comparable with set F's rf2 check, but it brings back the input defect G-36 fixed."
    recommended: A
    recommendation: "A."
  # Added on 2026-10-08 after merging main (bbdeaeb), straight into the Ledger with ArtifactData
  # (seed_build.py is never re-run over a live ledger). Plan §2, "Decisions D-9 to D-11".
  - id: D-9
    title: Register changes in a sandbox, through main's registrar
    plan_ref: plan §2 item 9
    blocks: [B-07, B-17]
    question: When you register or revoke a governing document in a sandbox, which rules decide whether the change is admitted?
    options:
      - key: A
        label: Main's registrar (RR-1 to RR-14)
        text: "Register and revoke go through `registrar.apply`, the rules your register attack set tests: authentication, employees only, the owning function, a head or Executive approves and never the submitter, terms and window bound to the text, scope, no backdating, no silent overlap, supersession, revocation, stale base, relations. A refusal names its rule. Experimenter mode also gets a labelled, logged bootstrap edit for scenarios outside the rules' scope. Retires D-4's derived needles."
      - key: B
        label: Task 7's own checks
        text: "Keep the plan's mini-registrar (self-approval, derived needles, version bump, window from front matter). Two rule sets can then drift, and web-next's #17 approve/return would match neither."
    recommended: A
    recommendation: "A. The registrar doesn't import the truth, so D-4's reason for building our own checks is gone, and one rule set serves the lab, the attack set and the OWM API. Caveat: its scope check (RR-8) reads the frozen corpus, not a sandbox's CSVs."
  - id: D-10
    title: The demo's ×N tallies
    plan_ref: plan §2 item 10
    blocks: []
    question: "The demo wants \"baseline 3 of 5, OWM 0 of 5\". In subject mode Claude Desktop is the agent, so one conversation is one draw. How should the server produce tallies?"
    options:
      - key: A
        label: A baseline phase after v1
        text: "An experimenter tool run_baseline(question, n): the lab's blind reader harness (Opus 5.5, fixed prompt, the same model on both sides), n draws in parallel, returning the tally and the logged transcripts. About $0.30 a draw on the whole corpus, $0.10 on the OWM-served slice."
      - key: B
        label: Separate presenter runner
        text: "v1 stays as designed; a presenter runner for the demo is built outside this server."
      - key: C
        label: Into v1 now
        text: "Add the baseline arm to v1 before acceptance. It delays set G."
    recommended: A
    recommendation: "A. Set G doesn't need tallies, so v1 ships first; the tally tool then reuses its sandboxes, logs and scoring."
  - id: D-11
    title: Where the OWM API for web-next (#16–#20) is built
    plan_ref: plan §2 item 11
    blocks: []
    question: The OWM API endpoints #16–#20 for web-next are to be built by a lab session on the same lab modules as this server's service/ core. How should they relate?
    options:
      - key: A
        label: On service/, after phase C
        text: "A third entry point on service/, once the engines land: a thin HTTP layer whose shapes follow web-next's lib/types.ts. One core serves the lab server, the subject server and the API. Needs read access to kloudtaxi/glowing-garbanzo for the contract."
      - key: B
        label: Separately, now
        text: "Build the API directly on the lab modules now and merge later. Faster to a first endpoint, but two cores in the meantime."
      - key: C
        label: After v1
        text: "Defer the API until this server's v1 is done."
    recommended: A
    recommendation: "A. The design doc already says the two should merge; building them on one core from the start avoids the merge."

